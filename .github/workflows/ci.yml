name: CI

# kit-self CI. (scaffold/.github is what generate lays into user repos — different thing.)
# Authoritative plugin validation is `claude plugin validate`, but that needs the Claude
# Code CLI + auth, so it stays a local/manual gate. These checks are dependency-light and
# cover the failure modes we've actually hit.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changelog:
    # Behavior changes must record a semver-classified CHANGELOG entry at PR time
    # (see CONTRIBUTING.md). Bypass with the 'skip-changelog' label.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG entry present
        run: |
          git fetch --no-tags --quiet origin "${{ github.event.pull_request.base.sha }}"
          bash scripts/check-changelog.sh "${{ github.event.pull_request.base.sha }}"

  changelog-frozen:
    # Released CHANGELOG sections are frozen — an in-flight PR must not drop an entry
    # into an already-published `## [X.Y.Z]`. Runs on every PR (even skip-changelog ones).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Released sections are frozen
        run: |
          git fetch --no-tags --quiet origin "${{ github.event.pull_request.base.sha }}"
          bash scripts/check-changelog-section.sh "${{ github.event.pull_request.base.sha }}"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9.22'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.7.6"

      - name: Repository test suite
        run: bash tests/run.sh

  upgrade-latest:
    name: Upgrade suite (latest Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.7.6"
      - name: Governed upgrade tests
        run: bash plugins/workbench-kit/tests/run.sh
