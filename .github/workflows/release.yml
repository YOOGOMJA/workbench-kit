name: Release

# A dated changelog section plus a synchronized version on main is the release intent.
# This workflow reruns the complete preflight before publishing and verifies the result.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9.22'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.7.6"

      - name: Decide whether to release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(python3 - <<'PY'
          import json
          print(json.load(open("plugins/workbench/.claude-plugin/plugin.json"))["version"])
          PY
          )"
          echo "version=$V"
          if git rev-parse "refs/tags/v$V" >/dev/null 2>&1; then
            RELEASE="$(gh release view "v$V" --json tagName,isDraft,isPrerelease)" || {
              echo "v$V exists without a readable GitHub Release" >&2
              exit 1
            }
            python3 - "$V" "$RELEASE" <<'PY'
          import json
          import sys

          version, raw = sys.argv[1:]
          value = json.loads(raw)
          assert value == {
              "tagName": "v" + version,
              "isDraft": False,
              "isPrerelease": False,
          }, value
          PY
            echo "v$V is already published"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eq "^## \\[$V\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "no dated CHANGELOG [$V] section; nothing to release"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/check-release-contract.sh "$V" notes.md
          echo "go=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Run release preflight
        if: steps.rel.outputs.go == 'true'
        run: bash scripts/release-preflight.sh "${{ steps.rel.outputs.version }}"

      - name: Create tag and GitHub Release
        if: steps.rel.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.rel.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.rel.outputs.version }}" \
            --notes-file notes.md

      - name: Verify published release
        if: steps.rel.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.rel.outputs.version }}"
          git fetch --quiet --force origin "refs/tags/v$V:refs/tags/v$V"
          TAG_COMMIT="$(git rev-parse "refs/tags/v$V^{commit}")"
          [ "$TAG_COMMIT" = "$GITHUB_SHA" ] || {
            echo "v$V points to $TAG_COMMIT, expected $GITHUB_SHA" >&2
            exit 1
          }
          RELEASE="$(gh release view "v$V" --json tagName,targetCommitish,isDraft,isPrerelease)"
          python3 - "$V" "$GITHUB_SHA" "$RELEASE" <<'PY'
          import json
          import sys

          version, revision, raw = sys.argv[1:]
          value = json.loads(raw)
          assert value == {
              "tagName": "v" + version,
              "targetCommitish": revision,
              "isDraft": False,
              "isPrerelease": False,
          }, value
          PY
